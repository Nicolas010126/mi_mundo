<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Para Ti 💖</title>
    <style>
        body {
            background: linear-gradient(to right, #ffe6f0, #ffe0b3);
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        h1 {
            color: #ff3366;
            font-size: 3em;
        }
        p {
            font-size: 1.5em;
            margin-top: 20px;
        }
        .heart {
            font-size: 5em;
            animation: beat 1s infinite;
            color: #ff0033;
        }
        @keyframes beat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
    </style>
</head>
<body>
    <h1>💖 Para Ti 💖</h1>
    <p>Solo quería recordarte lo especial que eres para mí.</p>
    <div class="heart">❤️</div>
</body>
</html>
